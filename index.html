<!doctype html>
<html lang="en" class="h-full overflow-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brays Intune</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231d4573'/><rect x='6' y='18' width='4' height='8' rx='1' fill='%23ffffff'/><rect x='14' y='12' width='4' height='14' rx='1' fill='%23ffffff'/><rect x='22' y='6' width='4' height='20' rx='1' fill='%23ffffff'/></svg>">
    <script>
      (function () {
        try {
          var key = "brays-intune-theme";
          if (!localStorage.getItem(key)) {
            var old = localStorage.getItem("themePref");
            if (old === "dark" || old === "light") localStorage.setItem(key, old);
          }
        } catch (e) {}
        document.documentElement.classList.add("locked");
      })();
    </script>
  </head>
  <body class="h-full overflow-hidden">
    <div id="root" class="h-full"></div>
    <div id="legacy-root" hidden></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
